name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install PyInstaller
      run: pip install pyinstaller
      
    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress
        
    - name: Generate icon
      run: python scripts/make_icon.py
      
    - name: Build with PyInstaller
      run: python -m PyInstaller --noconfirm main.spec
      
    - name: Build installer with Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $iscc = $cmd.Source }
        }
        if (-not (Test-Path $iscc)) {
          $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
        }
        if (Test-Path $iscc) {
          & $iscc "installer\setup.iss"
        } else {
          Write-Error "Inno Setup not found"
          exit 1
        }
        
    - name: Get version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}" -replace 'v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
        
    - name: Rename setup file
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        if (Test-Path "installer\Output\Setup_Ngokaf_Trans.exe") {
          Copy-Item "installer\Output\Setup_Ngokaf_Trans.exe" "Setup_Ngokaf_Trans_v$version.exe"
        }
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Setup_Ngokaf_Trans_v${{ steps.get_version.outputs.version }}.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
